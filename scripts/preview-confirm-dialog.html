<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm dialog preview</title>
    <link rel="stylesheet" href="../public/cursor-theme.css" />
    <link rel="stylesheet" href="../src/renderer/styles.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #888;
      }
    </style>
  </head>
  <body>
    <div class="confirm-overlay" role="presentation" style="position: relative; inset: auto; min-height: 100vh">
      <div
        class="confirm-dialog"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirm-dialog-title"
        aria-describedby="confirm-dialog-body"
      >
        <div class="confirm-dialog-header">
          <svg
            class="confirm-dialog-info-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            aria-hidden="true"
          >
            <circle cx="9" cy="9" r="7.25" stroke="currentColor" stroke-width="1.25" />
            <path d="M9 8.25V12.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <circle cx="9" cy="5.75" r="0.75" fill="currentColor" />
          </svg>
          <h2 id="confirm-dialog-title" class="confirm-dialog-title">允许执行工具 Shell?</h2>
        </div>
        <div class="confirm-dialog-body">
          <p id="confirm-dialog-body" class="confirm-dialog-detail"></p>
        </div>
        <div class="confirm-dialog-actions">
          <button type="button" class="confirm-dialog-btn">拒绝</button>
          <button type="button" class="confirm-dialog-btn confirm-dialog-btn-primary">允许</button>
        </div>
      </div>
    </div>
    <script>
      const detail = document.getElementById("confirm-dialog-body");
      detail.textContent = Array.from({ length: 24 }, (_, i) => `${i + 1}. npm run test -- --grep hookRunner`).join(
        "\n",
      );
    </script>
  </body>
</html>
